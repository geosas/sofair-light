# Extraction settings for the translatable strings (pybabel).
# We only scan app/: stav/ and api_ogc_process/ are out of scope (a vendored
# sub-project and an already-English package respectively). tarage.py and
# dilution.html are scanned but, since their strings are not wrapped in
# gettext, nothing is extracted from them.
[python: app/**.py]
[jinja2: app/templates/**.html]
