{% extends "base.html" %}

{% block content %}
<section class="section">
    <div class="container">
        <h1 class="title">{{ _('Create an information article') }}</h1>

        <form id="metadataForm">
            <table class="table is-fullwidth">
                <tr>
                    <td><label class="label">{{ _('Article title:') }}</label></td>
                    <td><input class="input" type="text" id="titre" required>
                    </td>
                </tr>
                <tr>
                    <td><label class="label">{{ _('Summary:') }}</label></td>
                    <td><textarea class="textarea" id="resume" required></textarea></td>
                </tr>
                <tr>
                    <td><label class="label">{{ _('Article body:') }}</label></td>
                    <td><textarea class="textarea" id="article" required></textarea></td>
                </tr>
                <tr>
                    <td><label class="label">{{ _('Illustration image:') }}</label></td>
                    <td><input class="input" type="file" id="image_obs" accept="image/png, image/jpeg" required></td>
                </tr>
            </table>

            <button class="button is-primary" type="submit">📡 {{ _('Send') }}</button>
        </form>

        <div id="message" class="notification is-hidden"></div>
    </div>
</section>

<script>
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }
    document.getElementById("metadataForm").addEventListener("submit", function (event) {
        event.preventDefault();  // Prevent the page from reloading

        // Get the form values
        let formData = new FormData();
        formData.append("titre", document.getElementById("titre").value);
        formData.append("resume", document.getElementById("resume").value);
        formData.append("article", document.getElementById("article").value);
        formData.append("image_obs", document.getElementById("image_obs").files[0]);

        // Send the data via a POST
        fetch("{{ request.script_root }}/private/createNews", {
            method: "POST",
            headers: {
                'X-CSRF-TOKEN': getCookie('csrf_access_token'),
            },
            body: formData,
            credentials: 'same-origin',
        })
            .then(response => response.json())
            .then(data => {
                const messageDiv = document.getElementById("message");
                messageDiv.classList.remove("is-hidden");
                messageDiv.classList.add("is-success");
                messageDiv.textContent = {{ _('Article sent successfully!')|tojson }};

                const link = document.createElement("a");
                link.href = data['url'];
                link.textContent = {{ _(' Click here to view the created article.')|tojson }};
                messageDiv.appendChild(link);

            })
            .catch(error => {
                const messageDiv = document.getElementById("message");
                messageDiv.classList.remove("is-hidden");
                messageDiv.classList.add("is-danger");
                messageDiv.textContent = {{ _('Error while submitting the form.')|tojson }};

            });
    });
</script>
{% endblock %}
