[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-ogc-api-processes"
version = "1.0.0"
description = "Reusable OGC API - Processes (Part 1: Core) engine for Flask"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "GéoSAS" }]
keywords = ["OGC", "OGC API", "Processes", "Flask", "geospatial"]

dependencies = [
    "flask>=3.0",
    "pydantic>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
# Optional SQLAlchemy job-store adapter (only if a host reuses its own database).
sqlalchemy = ["Flask-SQLAlchemy>=3.0"]
# Test suite.
test = ["pytest>=7"]

[project.urls]
Homepage = "https://geosas.fr"

# ``from flask_ogc_api_processes import create_ogc_blueprint`` is the public entry point.
[tool.setuptools.packages.find]
include = ["flask_ogc_api_processes*"]

[tool.setuptools.package-data]
flask_ogc_api_processes = [
    "templates/*.html",
    "templates/**/*.html",
    "static/css/*.css",
    "static/img/*",
]
