<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/icon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bulma2.min.css') }}" />
    <title>{{ config.APP_TITLE }}</title>
    <style>
        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            /* 100% of the viewport width */
            height: 100%;
            /* 100% of the viewport height */
            background-color: white;
            /* Background color, change if needed */
            z-index: 1000;
            /* Ensures the div sits above other elements */
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <nav class="navbar is-success" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="https://geosas.fr" target="blank">
                <img src="{{ url_for('static', filename='img/icon.png')}}">
            </a>
            <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navMenu">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </a>
        </div>

        <div id="navMenu" class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="/" style="background-color:#4a4a4a;color:white">
                    Home
                </a>
                <div class="navbar-item has-dropdown is-hoverable">
                    <a class="navbar-link">
                        Data access
                    </a>
                    <div class="navbar-dropdown">
                        <a class="navbar-item" href="/resume">
                            Observatory summary
                        </a>
                        <a class="navbar-item" href="/vidae-archive">
                            Visualization/download
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero is-fullheight-with-navbar">

        <div class="hero body">
            <div id='le_container' class="container has-text-centered">
                {% block content %}
                {% endblock %}
            </div>
        </div>


    </section>

</body>
<script>

    document.addEventListener('DOMContentLoaded', () => {

        // Get all "navbar-burger" elements
        const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);

        // Check if there are any navbar burgers
        if ($navbarBurgers.length > 0) {

            // Add a click event on each of them
            $navbarBurgers.forEach(el => {
                el.addEventListener('click', () => {

                    // Get the target from the "data-target" attribute
                    const target = el.dataset.target;
                    const $target = document.getElementById(target);

                    // Toggle the "is-active" class on both the "navbar-burger" and the "navbar-menu"
                    el.classList.toggle('is-active');
                    $target.classList.toggle('is-active');

                });
            });
        }

    });
</script>

</html>
